<div class="sidebar-container">
  <div class="logo-area" routerLink="/" style="cursor: pointer;">
    <mat-icon>library_books</mat-icon>
    <span>BiblioTech</span>
  </div>

  <mat-nav-list>
    <a mat-list-item routerLink="/" >
      <mat-icon matListItemIcon>dashboard</mat-icon>
      <span matListItemTitle>Dashboard</span>
    </a>
    
    <a mat-list-item routerLink="/books">
      <mat-icon matListItemIcon>book</mat-icon>
      <span matListItemTitle>Books</span>
    </a>
    @if(isAdmin()){
      <a mat-list-item routerLink="/manage-loans">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Manage loans</span>
      </a>
    }
    <a mat-list-item routerLink="/readers">
      <mat-icon matListItemIcon>people</mat-icon>
      <span matListItemTitle>Readers</span>
    </a>
  </mat-nav-list>
</div>
